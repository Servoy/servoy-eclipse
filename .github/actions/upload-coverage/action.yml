# Uploads the coverage report of a GitHub Actions run to the combined Servoy coverage job on Jenkins
# (Jenkinsfile.coverage in servoy-eclipse). Use it as the last step of a workflow, after the tests:
#
#   - name: Upload coverage to the combined Servoy coverage job (Jenkins)
#     if: ${{ !cancelled() && github.ref == 'refs/heads/master' && vars.JENKINS_COVERAGE_URL != '' }}
#     uses: Servoy/servoy-eclipse/.github/actions/upload-coverage@master
#     with:
#       jenkins-url: ${{ vars.JENKINS_COVERAGE_URL }}           # https://build.servoy.com/jenkins (organisation variable)
#       trigger-token: ${{ secrets.JENKINS_COVERAGE_TOKEN }}    # 'Trigger builds remotely' token of the job (organisation secret)
#       working-directory: ${{ env.COMPONENT_DIR }}             # where the coverage folder is
#       patterns: '*coverage/combined/cobertura-coverage.xml'   # ONE report per run, see below
#
# It zips the matching coverage files and starts the combined job through the build-token-root endpoint
# (/buildByToken/buildWithParameters), with the zip as file parameter. That endpoint needs no Jenkins user: the
# token only allows starting this one job. Jenkins keeps the LAST upload of every repo, so run it on the branch
# that should be reported (usually master), not on every PR or branch.
#
# Upload ONE report per run. A run that writes the same coverage as cobertura-coverage.xml AND lcov.info, or per
# test type (jsdom, browser) AND combined, would be counted several times in the combined report. Pick the
# merged file (for the Angular components: coverage/combined/cobertura-coverage.xml).
#
# Names of repos that are built on Jenkins (servoy-eclipse, server, servoy-client, ...) are refused by the
# combined job, so an upload cannot overwrite their coverage.
name: Upload coverage to the combined Servoy coverage job
description: Sends the JaCoCo / Cobertura reports of this workflow run to the combined coverage job on Jenkins.

inputs:
  jenkins-url:
    description: Base URL of Jenkins, including the /jenkins context path. Must be https.
    required: true
  trigger-token:
    description: The 'Trigger builds remotely' token of the combined coverage job (a GitHub secret).
    required: true
  job:
    description: Full name of the combined coverage job.
    required: false
    default: master/coverage
  repo-name:
    description: Name under which the coverage is listed in the combined report. Only letters, digits, dot, dash and underscore.
    required: false
    default: ${{ github.event.repository.name }}
  working-directory:
    description: Folder to search for coverage files; the paths inside the zip are relative to it.
    required: false
    default: .
  patterns:
    description: Space separated zip patterns of the files to upload. Start each with * so it matches at any depth.
    required: false
    default: '*jacoco.xml *cobertura-coverage.xml'
  branch:
    description: Only a run on this branch uploads; on any other branch (2026.9, v2026.x, PRs, ...) the step does nothing.
    required: false
    default: master
  fail-on-error:
    description: Fail the workflow when the upload fails. By default a failed upload only gives a warning, coverage must not break a build.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Zip and upload the coverage files
      shell: bash
      env:
        # values go through the environment, never through ${{ }} inside the script
        JENKINS_URL: ${{ inputs.jenkins-url }}
        TRIGGER_TOKEN: ${{ inputs.trigger-token }}
        JOB: ${{ inputs.job }}
        REPO_NAME: ${{ inputs.repo-name }}
        WORKDIR: ${{ inputs.working-directory }}
        PATTERNS: ${{ inputs.patterns }}
        FAIL_ON_ERROR: ${{ inputs.fail-on-error }}
        ONLY_BRANCH: ${{ inputs.branch }}
      run: |
        set -uo pipefail
        # Only one branch feeds the combined report, also when a workflow forgets the 'if' on this step:
        # release branches (2026.9, ...) build the same workflow and would otherwise overwrite master's coverage.
        if [ "${GITHUB_REF:-}" != "refs/heads/${ONLY_BRANCH}" ]; then
          echo "coverage upload skipped: ${GITHUB_REF:-?} is not refs/heads/${ONLY_BRANCH}"
          exit 0
        fi
        fail() {
          if [ "$FAIL_ON_ERROR" = "true" ]; then echo "::error::$1"; exit 1; fi
          echo "::warning::$1 (coverage upload skipped, the workflow continues)"; exit 0
        }
        case "$JENKINS_URL" in https://*) ;; *) fail "jenkins-url must start with https://" ;; esac
        [ -n "$TRIGGER_TOKEN" ] || fail "trigger-token is empty (secret JENKINS_COVERAGE_TOKEN not available to this repo?)"
        # these go into the URL query and the repo name becomes a folder name on Jenkins: keep them plain
        [[ "$REPO_NAME" =~ ^[A-Za-z0-9][A-Za-z0-9._-]{0,79}$ ]] || fail "invalid repo-name '$REPO_NAME'"
        [[ "$JOB" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,120}$ ]] || fail "invalid job '$JOB'"

        cd "$WORKDIR" || fail "working-directory $WORKDIR does not exist"
        zip_file="$(mktemp -u "${RUNNER_TEMP:-/tmp}/coverage-upload-XXXXXX.zip")"
        read -r -a patterns <<< "$PATTERNS"
        if ! zip -r -q "$zip_file" . -i "${patterns[@]}" -x '*/node_modules/*' '*/.git/*'; then
          fail "no coverage files matching '$PATTERNS' found in $WORKDIR"
        fi
        echo "uploading $(unzip -Z1 "$zip_file" | wc -l) coverage file(s) for '$REPO_NAME' to $JOB"
        unzip -Z1 "$zip_file" | sed 's/^/  /'

        # The token goes through curl's config on stdin (as a --url-query), so it is not in the process list or
        # in this log. COVERAGE_SOURCE is the repo name, COVERAGE_ZIP the file parameter (multipart).
        status="$(printf 'url-query = "token=%s"\n' "$TRIGGER_TOKEN" | curl -sS -K - -o /dev/null -w '%{http_code}' \
          -X POST "${JENKINS_URL%/}/buildByToken/buildWithParameters?job=${JOB}&COVERAGE_SOURCE=${REPO_NAME}" \
          -F "COVERAGE_ZIP=@${zip_file}")" || fail "upload to Jenkins failed (network)"
        case "$status" in
          201|303) echo "coverage of '$REPO_NAME' sent to Jenkins ($status)" ;;
          404)     fail "Jenkins answered 404: unknown job '$JOB' or wrong trigger token" ;;
          *)       fail "upload to Jenkins failed with HTTP $status" ;;
        esac
