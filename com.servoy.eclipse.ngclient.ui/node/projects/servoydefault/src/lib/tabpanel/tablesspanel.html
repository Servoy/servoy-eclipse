<div  #element 
	style="position:absolute;width:100%;height:100%;"

	[id]="servoyApi().getMarkupId()" 
	[sabloTabseq]="tabSeq()" 
	[sabloTabseqConfig]="{container: true, reservedGap: 50}"

</div>
