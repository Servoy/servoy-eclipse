<div class="svy-dialog" [class.window]="!isUndecorated()" [class]="getCSSClassName()" [style.background-color]="getBackgroundColor()" [sabloTabseq]="1" [sabloTabseqConfig]="{container: true}">
  <div [style.opacity]="getOpacity()">
    <div  class='window-header' tabindex="-1"  style="outline:0;" [style.display]="isUndecorated() ? 'none' : 'block'">
      <button type="button" class="svy-dialog-close"
      aria-hidden="true" tabindex="-1" (click)="cancel()">x</button>
      <h4 class="window-title"></h4>
    </div>
    <div class="window-body">
      @if (defaultNavigator()) {
        <svy-default-navigator [name]="formName()!"></svy-default-navigator>
      }
      @if (navigatorFormName() != null) {
        <svy-form [name]="navigatorFormName()!"></svy-form>
      }
      <div [id]="window.name + '_tabStart'" [sabloTabseq]="1" (focus)="firstElementFocused($event)"></div>
      <div [sabloTabseq]="2" [sabloTabseqConfig]="{container: true}" [style]="{'height': '100%', 'position': 'absolute', 'top': '0px', 'right': '0px', 'bottom': '0px', 'left': (this.window.navigatorForm()?.size?.width ?? 0) + 'px'}">
        @if (formName() != null) {
          <svy-form [name]="formName()!"></svy-form>
        }
      </div>
      <div [id]="window.name + '_tabStop'" [sabloTabseq]="3" (focus)="lastElementFocused($event)"></div>
    </div>
    <div class="window-footer" [style.display]="isUndecorated() ? 'none' : 'block'"></div>
  </div>
</div>
